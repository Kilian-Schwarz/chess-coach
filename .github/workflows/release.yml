name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: Tools/release/changelog-section.sh "${{ steps.version.outputs.value }}" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
    outputs:
      version: ${{ steps.version.outputs.value }}

  mac:
    needs: notes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: Tools/release/import-certificate.sh
      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials release-ci --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
      - name: Build, sign, notarize, package
        env:
          NOTARY_PROFILE: release-ci
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: Tools/release/release-local.sh --version "${{ needs.notes.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip

  windows:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Set version
        shell: bash
        run: Tools/release/set-version.sh "${{ needs.notes.outputs.version }}"
      - name: Build ZIP and setup
        shell: bash
        env:
          OFFICIAL_BUILD: "1"
        run: windows/tools/build.sh "${{ needs.notes.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe

  publish:
    needs: [notes, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create update.json
        env:
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/update-key.pem"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY_PEM" > "$RUNNER_TEMP/update-key.pem"
          UPDATE_SIGNING_KEY="$RUNNER_TEMP/update-key.pem" Tools/release/make-update-json.sh \
            --version "${{ needs.notes.outputs.version }}" --notes artifacts/notes/notes.md --out artifacts/update.json \
            --macos "artifacts/mac/ChessCoach-${{ needs.notes.outputs.version }}-macos.zip" \
            --windows "artifacts/windows/ChessCoach-${{ needs.notes.outputs.version }}-windows-x64.zip"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: artifacts/notes/notes.md
          files: |
            artifacts/mac/*
            artifacts/windows/*
            artifacts/update.json
